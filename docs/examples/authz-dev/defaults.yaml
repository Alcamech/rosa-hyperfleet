# Example dev override: copy into .ephemeral-env/ and resync. It replaces the whole
# default bundle, so it repeats the default RC grants and adds a read-only role in the
# RC account.
# @@AWS_ACCOUNT_ID@@ resolves to the RC account at deploy time; replace dev-readers
# with your role. Customer accounts are allowlisted at runtime, not here.
applications:
  regional-cluster:
    platformApi:
      authz:
        config: |
          formatVersion: 1
          registeredAccounts: ["@@AWS_ACCOUNT_ID@@"]
          policies:
            - id: rc-all-actions
              ownerAccountID: "@@AWS_ACCOUNT_ID@@"
              content: |
                permit(principal, action in Seaplane::Action::"AllActions", resource)
                when { context.accountId == "@@AWS_ACCOUNT_ID@@" }
                unless { context.requestLabels.hasTag("authz-deny-probe") };
            - id: dev-read-only
              ownerAccountID: "@@AWS_ACCOUNT_ID@@"
              content: |
                permit(principal, action in Seaplane::Action::"ReadOnly", resource)
                when { context.accountId == "@@AWS_ACCOUNT_ID@@" };
          attachments:
            - id: rc-child-admin
              policyID: rc-all-actions
              principalARN: arn:aws:iam::@@AWS_ACCOUNT_ID@@:role/{{ aws.child_admin_role_name }}
              scope: global
            - id: rc-e2e-user
              policyID: rc-all-actions
              principalARN: arn:aws:iam::@@AWS_ACCOUNT_ID@@:user/e2e
              scope: global
            - id: dev-readers
              policyID: dev-read-only
              principalARN: arn:aws:iam::@@AWS_ACCOUNT_ID@@:role/dev-readers
              scope: global
