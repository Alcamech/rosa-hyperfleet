apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaplane-db-dsn
  namespace: seaplane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: seaplane-db-dsn
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: {{ .Values.global.cluster_name }}-seaplane-db-dsn
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
